<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Facelets Hello Greeting</title>
    </h:head>
    <h:body>
        <h:form>
            <p:card style="width: 35rem; margin-bottom: 2em">
                <f:facet name="title">Gestionar Asignaturas</f:facet>
                <h:panelGrid columns="3">
                    <p:outputLabel for="txfCodigo" value="Código: "/>
                    <p:inputText id="txfCodigo" value="#{asignCtrl.asignatura.codigo}"/>
                    <p:message for="txfCodigo"/>
                    <p:outputLabel for="txfNombre" value="Nombre: "/>
                    <p:inputText id="txfNombre" value="#{asignCtrl.asignatura.nombre}"/>
                    <p:message for="txfNombre"/>
                    <p:outputLabel for="txfCreditos" value="Créditos: "/>
                    <p:inputNumber id="txfCreditos" value="#{asignCtrl.asignatura.creditos}"/>
                    <p:message for="txfCreditos"/>
                    <p:outputLabel for="txfIntensidad" value="Intensidad: "/>
                    <p:inputNumber id="txfIntensidad" value="#{asignCtrl.asignatura.intensidad}"/>
                    <p:message for="txfIntensidad"/>
                </h:panelGrid>
            </p:card>
        </h:form>

        <p:card style="width: 50rem; margin-bottom: 2em">
            <p:dataTable var="asig" value="#{dtBasicView.products}">
                <p:column headerText="Código">
                    <h:outputText value="#{asignCtrl.asignatura.codigo}"/>
                </p:column>
                <p:column headerText="Nombre">
                    <h:outputText value="#{asignCtrl.asignatura.nombre}"/>
                </p:column>
                <p:column headerText="Créditos">
                    <h:outputText value="#{asignCtrl.asignatura.creditos}"/>
                </p:column>
                <p:column headerText="Intensidad">
                    <h:outputText value="#{asignCtrl.asignatura.intensidad}"/>
                </p:column>
            </p:dataTable>
        </p:card>
    </h:body>
</html>
