<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Facelets Hello Greeting</title>
    </h:head>
    <h:body>
        <h:form>
            <p:card style="width: 35rem; margin-bottom: 2em">
                <f:facet name="title">Gestionar Asignaturas</f:facet>
                <h:panelGrid columns="3">
                    <p:outputLabel for="txfCodigo" value="Código: "/>
                    <p:inputText id="txfCodigo" value="#{asignCtrl.asignatura.codigo}" required="true"/>
                    <p:message for="txfCodigo"/>
                    <p:outputLabel for="txfNombre" value="Nombre: "/>
                    <p:inputText id="txfNombre" value="#{asignCtrl.asignatura.nombre}" required="true"/>
                    <p:message for="txfNombre"/>
                    <p:outputLabel for="txfCreditos" value="Créditos: "/>
                    <p:inputNumber id="txfCreditos" value="#{asignCtrl.asignatura.creditos}" required="true"/>
                    <p:message for="txfCreditos"/>
                    <p:outputLabel for="txfIntensidad" value="Intensidad: "/>
                    <p:inputNumber id="txfIntensidad" value="#{asignCtrl.asignatura.intensidad}" required="true"/>
                    <p:message for="txfIntensidad"/>
                </h:panelGrid>

                <p:messages id="mensajes" globalOnly="true" closable="true" />

                <f:facet name="footer">
                    <p:commandButton icon="pi pi-check" value="save"
                                     action="#{asignCtrl.guardar()}"
                                     process="@this txfCodigo txfNombre txfCreditos txfIntensidad"
                                     update="mensajes txfCodigo txfNombre txfCreditos txfIntensidad tabla"/>
                    <p:commandButton icon="pi pi-times" value="cancel"
                                     styleClass="ui-button-secondary"
                                     style="margin-left: .5em"
                                     action="#{asignCtrl.cancelar()}"
                                     process="@this"
                                     update="mensajes txfCodigo txfNombre txfCreditos txfIntensidad"/>
                </f:facet>
            </p:card>
        </h:form>

        <p:dataTable id="tabla" value="#{asignCtrl.asignaturas}" var="obj">
            <p:column headerText="Código">#{obj.codigo}</p:column>
            <p:column headerText="Nombre">#{obj.nombre}</p:column>
            <p:column headerText="Créditos">#{obj.creditos}</p:column>
            <p:column headerText="Intensidad">#{obj.intensidad}</p:column>
        </p:dataTable>
    </h:body>
</html>
